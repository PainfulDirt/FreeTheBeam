# K1 Max extras that the LiDAR features build on: keep-out zones, the nozzle
# wipe, True Zero touch (Z=0 from a load-cell nozzle touch), the combined
# probe + LiDAR twist calibration and XY skew loading. All of it is in daily
# use on the development printer (K1 Max, Simple AF + Kalico, Microprobe V2
# 20.3mm behind the nozzle, load cells, glass bed + textured PEI).
#
# Needs klipper/keep_out.py, klipper/nozzle_wipe.py and klipper/twist_touch.py
# linked into klippy/plugins (docs/install-k1max.md), a [probe] (Microprobe)
# and a [load_cell_probe] (Kalico). The coordinates below were measured on
# ONE printer: check them on yours before using them (KEEP_OUT_STATUS, and
# watch the first wipe with a hand on the power switch).

# --------------------------------------------------------------- keep-out

# Every G-code move is checked; a move that would end in, or pass through, a
# zone is refused before anything moves. Zones in nozzle coordinates
# (x_min, y_min, x_max, y_max). Here: the Microprobe, 20.3mm behind the nozzle,
# hits the Z rod housings at the back. lidar.py plans its scans around them.
[keep_out]
# middle housing (3cm) + 1cm each side
zone1: 130, 293, 170, 330
# left corner
zone2: -10, 292, 19, 330
# right housing, inner part
zone3: 266, 302, 286, 330
# right corner
zone4: 286, 287, 330, 330

# XY skew (LiDAR: SKEW_SCAN NAME=a ROT=0, turn the printed square ~90 degrees,
# SKEW_SCAN NAME=b ROT=90, SKEW_CALIBRATE NAMES=a,b APPLY=1, SAVE_CONFIG).
# Must come AFTER [keep_out]: transforms chain in config order, so the zones
# are checked in raw gantry coordinates.
[skew_correction]

# Klipper does not load a saved skew profile by itself
[delayed_gcode _SKEW_LOAD]
initial_duration: 1
gcode:
    {% if "skew_correction lidar" in printer.configfile.settings %}
      SKEW_PROFILE LOAD=lidar
    {% endif %}

# --------------------------------------------------------------- nozzle wipe

# NOZZLE_WIPE: Creality's NOZZLE_CLEAR plus a scrub, all on a strip at the
# back-left edge of the plate: random start along the strip, both ends touched
# with the load cells (mesh off), ooze anchored while heating, hot drag into
# the PEI, scrub passes, retract, cool down pressed, slow rising peel, flick
# for strings. NOZZLE_SCRUB is the short version for Kalico's
# nozzle_scrubber_gcode (bad taps). Full description in nozzle_wipe.py.
[nozzle_wipe]
x_min: 40
x_max: 100
y_min: 297.4
y_max: 298.6
wipe_len: 25
peel_len: 25
touch_temp: 150
cool_temp: 160

# lidar.py runs this before nozzle touches if it exists
[gcode_macro _TOUCH_NOZZLE_WIPE]
description: Clean the nozzle on the rear edge of the bed before a load cell touch (TEMP = print temperature, default 200)
gcode:
    NOZZLE_WIPE TEMP={params.TEMP|default(0)|float} AFTER_TEMP={printer["gcode_macro _LOAD_CELL_TOUCH_Z"].touch_temp}

# --------------------------------------------------------------- True Zero touch

# Switches (Outputs panel); see _LIDAR_SWITCHES in lidar.example.cfg to keep
# them across restarts.
[output_pin True_Zero_Touch]
pin: virtual_pin:nozzle_touch_pin
value: 1

[output_pin Nozzle_Deep_Clean]
pin: virtual_pin:nozzle_wipe_pin
value: 1

# Z=0 from the nozzle itself: wipe, touch the bed at the mesh's zero reference
# with the load cells, then check the result with the Microprobe on the same
# spot. A touch that reads early (ooze) is cleaned and repeated once; a touch
# that disagrees with the probe falls back to probe Z. Call it from
# START_PRINT after the bed mesh (Simple AF: _SAF_START_PRINT_AFTER_BED_MESH)
# with WIPE_TEMP=<print temperature>. lidar.py reads touch_temp from here.
[gcode_macro _LOAD_CELL_TOUCH_Z]
description: Wipe the nozzle, touch it on the bed at the mesh zero reference and make that contact Z=0
variable_enabled: True
# keep the nozzle cool enough not to mark the bed coating
variable_touch_temp: 150
# accepted difference to the Microprobe (mm). Ooze on the nozzle makes it
# touch early, which reads negative, so that side is kept tight. Measure the
# probe's z_offset under touch conditions (bed ~70C with the heater off,
# nozzle 150C, after the wipe): a clean touch then reads within ~0.01 of zero.
variable_min_difference: -0.03
variable_max_difference: 0.15
gcode:
    {% set on = params.FORCE|default(0)|int == 1 or printer['output_pin True_Zero_Touch'].value > 0 %}
    {% if enabled and on %}
      {% set ref = printer.configfile.settings.bed_mesh.zero_reference_position %}
      {% set probe_cfg = printer.configfile.settings.probe %}
      {% set bed_target = printer.heater_bed.target %}
      M109 S{touch_temp}
      {% if printer['output_pin Nozzle_Deep_Clean'].value > 0 %}
        _TOUCH_NOZZLE_WIPE TEMP={params.WIPE_TEMP|default(0)|float}
      {% endif %}
      # the bed heater switching adds noise to the load cells
      M140 S0
      G90
      G0 Z5 F900
      G0 X{ref[0]} Y{ref[1]} F6000
      RESPOND TYPE=command MSG='True Zero touch: touching the bed with the nozzle'
      LOAD_CELL_PROBE HOME=Z
      G0 Z5 F900
      # check the new Z=0 with the Microprobe on the same spot of the bed
      G0 X{ref[0] - probe_cfg.x_offset} Y{ref[1] - probe_cfg.y_offset} F6000
      PROBE SAMPLES=3 SAMPLES_RESULT=median
      G0 Z5 F900
      # separate macro so it is rendered after PROBE has finished
      _LOAD_CELL_TOUCH_CHECK
      # a dirty touch: clean once more and touch again
      _LOAD_CELL_TOUCH_RETRY WIPE_TEMP={params.WIPE_TEMP|default(0)|float}
      M140 S{bed_target}
      M190 S{bed_target}
    {% else %}
      RESPOND TYPE=command MSG='True Zero touch: switched off, using probe Z'
    {% endif %}

[gcode_macro _LOAD_CELL_TOUCH_CHECK]
# set when the touch read early and the nozzle gets cleaned again
variable_retry: 0
gcode:
    {% set touch = printer["gcode_macro _LOAD_CELL_TOUCH_Z"] %}
    {% set final = params.FINAL|default(0)|int == 1 or printer['output_pin Nozzle_Deep_Clean'].value == 0 %}
    # after a clean touch the probe triggers at its z_offset plus any real
    # offset error; ooze on the nozzle touches early and reads negative. The
    # load cell's own z_offset shifts the new frame; take it out again
    {% set lc_offset = printer.configfile.settings.load_cell_probe.z_offset %}
    {% set diff = printer.probe.last_z_result - printer.configfile.settings.probe.z_offset - lc_offset %}
    SET_GCODE_VARIABLE MACRO=_LOAD_CELL_TOUCH_CHECK VARIABLE=retry VALUE={1 if diff < touch.min_difference and not final else 0}
    {% if diff < touch.min_difference and not final %}
      RESPOND TYPE=command MSG="True Zero touch: touch is {'%+.3f' % diff}mm off the probe (dirty nozzle?), cleaning the nozzle again"
    {% elif diff < touch.min_difference %}
      RESPOND TYPE=command MSG="True Zero touch: touch is {'%+.3f' % diff}mm off the probe (dirty nozzle?), using probe Z instead"
    {% elif diff > touch.max_difference %}
      RESPOND TYPE=command MSG="True Zero touch: touch is {'%+.3f' % diff}mm off the probe (more than expected), using probe Z instead"
    {% else %}
      RESPOND TYPE=command MSG="True Zero touch: Z=0 set by the nozzle ({'%+.3f' % diff}mm vs probe)"
    {% endif %}
    {% if (diff < touch.min_difference and final) or diff > touch.max_difference %}
      # Simple AF's homing position; use your own Z homing spot elsewhere
      G90
      G0 X{printer["gcode_macro _HOMING_PARAMS"].home_x} Y{printer["gcode_macro _HOMING_PARAMS"].home_y} F6000
      G28 Z
    {% endif %}

[gcode_macro _LOAD_CELL_TOUCH_RETRY]
gcode:
    {% if printer["gcode_macro _LOAD_CELL_TOUCH_CHECK"].retry %}
      {% set ref = printer.configfile.settings.bed_mesh.zero_reference_position %}
      {% set probe_cfg = printer.configfile.settings.probe %}
      _TOUCH_NOZZLE_WIPE TEMP={params.WIPE_TEMP|default(0)|float}
      M140 S0
      G90
      G0 Z5 F900
      G0 X{ref[0]} Y{ref[1]} F6000
      LOAD_CELL_PROBE HOME=Z
      G0 Z5 F900
      G0 X{ref[0] - probe_cfg.x_offset} Y{ref[1] - probe_cfg.y_offset} F6000
      PROBE SAMPLES=3 SAMPLES_RESULT=median
      G0 Z5 F900
      _LOAD_CELL_TOUCH_CHECK FINAL=1
    {% endif %}

# --------------------------------------------------------------- twist

# AXIS_TWIST_TOUCH_CALIBRATE: at spots along X the probe measures the bed and
# the nozzle touches the same spot with the load cells; the difference's
# variation along X is the carriage twist, saved for the probe in
# [axis_twist_compensation]. With the LiDAR service configured, the LiDAR
# looks at the same spots too and its own twist table (lidar_twist) is saved
# in the same run. Passes alternate direction; a drift between them is
# fitted out, max_pass_diff (0.04) is judged on what is left.
[axis_twist_compensation]
# probe in line with the nozzle on X: the whole X travel can be measured
calibrate_end_x: 290

[twist_touch]
passes: 2
samples: 3
points: 7
