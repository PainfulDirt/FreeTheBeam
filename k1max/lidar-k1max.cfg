# FreeTheBeam on a Creality K1 Max with Simple AF + Kalico: the [lidar]
# section and the driver macro. Use together with klipper/lidar.example.cfg
# (macros) and, optionally, k1max/k1max-extras.cfg (keep-out, wipe, True Zero
# touch, twist touch). Values from the development printer (glass bed +
# textured PEI); LIDAR_OFFSET_CALIBRATION measures your own mount and its
# result (variables.cfg) overrides x_offset/y_offset here.

[lidar]
x_offset: -36
y_offset: -21.2
x_dir: -1
# captures and analysis on a helper computer (helper/lidar_service.py)
#service: HELPER_IP:7131
# dwell scans locked to the frames: a row = settle + the ~0.11s a frame covers
# + 2x margin + the move, which must fit one frame (0.2s, run LIDAR_TIMING)
dwell_settle: 0.03
dwell_margin: 0.01
# the keep-out zones at the back (Z rod housings) end the usable Y at 265
mesh_min: 5, 5
mesh_max: 270, 265
# calibration lines (LIDAR_TWIST_CALIBRATE AXIS=X / AXIS=Y)
twist_y: 145
ytwist_x: 100, 200
# nozzle touches with Kalico's load cell probe, at 150C, after the wipe
# from k1max-extras.cfg (leave touch_wipe_gcode out without it)
touch: load_cell
touch_temp: 150
touch_wipe_gcode: _TOUCH_NOZZLE_WIPE

# --------------------------------------------------------------- driver

# K1 Max only: starts the driver (k1max/lidar-start.sh). Change the path to
# where you put this repo.
[gcode_shell_command k1_lidar_start]
command: /usr/data/FreeTheBeam/k1max/lidar-start.sh
timeout: 60
verbose: True

[gcode_macro LIDAR_DRIVER]
description: Restart the LiDAR driver; DRIVER=direct (open driver, default) or DRIVER=middleware (Creality's, fallback)
gcode:
    {% set d = params.DRIVER|default('direct')|lower %}
    {% if d not in ['direct', 'middleware'] %}
        RESPOND TYPE=error MSG="LIDAR_DRIVER: DRIVER=direct or DRIVER=middleware"
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
        RESPOND TYPE=error MSG="LIDAR_DRIVER: not while printing"
    {% else %}
        {% if printer.save_variables.variables.lidar_driver|default('direct') != d %}
            SAVE_VARIABLE VARIABLE=lidar_driver VALUE="'{d}'"
        {% endif %}
        RUN_SHELL_COMMAND CMD=k1_lidar_start
    {% endif %}

