# FreeTheBeam [lidar] for any Cartesian/CoreXY Klipper printer with the
# Creality LiDAR module mounted on the toolhead (docs/install-other-printer.md).
# Use together with klipper/lidar.example.cfg (macros). LIDAR_SETUP_CHECK says
# what is still missing.

[lidar]
# where the middle of the laser line is, relative to the nozzle, with the
# nozzle offset_z above the bed. Rough values from a ruler are enough to
# start; LIDAR_OFFSET_CALIBRATION measures them (saved in variables.cfg,
# overrides these)
x_offset: -36
y_offset: -21
#offset_z: 3
# the profile's x runs towards printer -X (-1) or +X (1); a module mounted
# turned by 180 degrees flips it
x_dir: -1
# nozzle height for scans: the module works 3-5 mm above the surface
#scan_z: 3
# the helper service on this host (host/install.sh USER --helper) or on
# another computer; meshes, the first-layer check and dwell scans need it
service: 127.0.0.1:7131
# narrow where meshes and calibrations look (default: everything the laser
# reaches within the travel); use it to stay clear of clips or a wiper
#mesh_min: 5, 5
#mesh_max: 200, 200
# calibration lines (default: the area's Y centre / 1/3 and 2/3 of its X)
#twist_y: 100
#ytwist_x: 70, 140
# nozzle touches for calibrations, level 5 and MESH_BENCHMARK:
#   load_cell  Kalico's [load_cell_probe]
#   probe      any [probe]/[bltouch] (moved over the spot; the reference is
#              then the probe, less accurate than a nozzle touch)
#   gcode      your own command (touch_gcode) and the status value holding
#              the contact Z (touch_result: object:key)
#   none       no touches; unset: load_cell, else probe, else none
#touch: probe
#touch_gcode: NOZZLE_TOUCH
#touch_result: nozzle_touch:last_touch_z
#touch_temp: 150
#touch_wipe_gcode: CLEAN_NOZZLE
# dwell scans locked to the frames (LIDAR_TIMING measures the frame window)
dwell_settle: 0.03
dwell_margin: 0.01
