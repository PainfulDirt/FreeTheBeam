# FreeTheBeam [lidar] for a Creality Ender 3 V3 SE on mainline Klipper with
# a Raspberry Pi as host, the LiDAR module on the Pi's USB
# (host/install.sh USER --helper). Example of a non-K1 setup; the mount, and
# so the offsets, are yours: measure them with LIDAR_OFFSET_CALIBRATION.
#
# Nozzle touches use the bed's strain gauge through a nozzle_touch plugin
# that registers NOZZLE_TOUCH and keeps the contact Z in its status as
# last_touch_z. With only the CR Touch, use touch: probe instead.

[lidar]
# placeholders until LIDAR_OFFSET_CALIBRATION: depends on your mount
x_offset: -36
y_offset: -21
x_dir: -1
service: 127.0.0.1:7131
# 220 x 220 bed; stay off the edges
mesh_min: 5, 5
mesh_max: 215, 215
touch: gcode
touch_gcode: NOZZLE_TOUCH
touch_result: nozzle_touch:last_touch_z
touch_temp: 150
dwell_settle: 0.03
dwell_margin: 0.01
