# Printer-neutral macros for klipper/lidar.py (FreeTheBeam).
#
# Paste the parts you need into your printer config, next to a [lidar]
# section from config/ (generic.cfg, ender3v3se.cfg) or k1max/lidar-k1max.cfg.
#
# Needs:
#   - lidar.py linked into klippy/plugins (docs/install-other-printer.md,
#     docs/install-k1max.md)
#   - [save_variables] (calibrations, tables and switches are stored there)
#   - [exclude_object] and a slicer that labels objects, for ADAPTIVE=1
#     meshes and the first-layer check
#   - the helper service (`service:` in [lidar]) for bed meshes, the
#     first-layer check and dwell scans
#   - a touch method (`touch:` in [lidar]: load cells, a probe or your own
#     nozzle-touch command) for LIDAR_TWIST_CALIBRATE, LIDAR_GRID_CALIBRATE,
#     LIDAR_BED_MESH LEVEL=5 and MESH_BENCHMARK
#   - the helper with numpy + PIL for the camera and flow calibrations
#     (LIDAR_PA_CALIBRATION with the camera or LiDAR strips,
#     LIDAR_FLOW_CALIBRATION, the camera part of LIDAR_OFFSET_CALIBRATION;
#     docs/camera.md). The service on the printer itself (service_local:
#     True, docs/install-helper.md) does everything else
#
# The full command reference is the comment block at the top of lidar.py;
# LIDAR_SETUP_CHECK tells you what your setup can do.

# --------------------------------------------------------------- switches

# On/off switches in Fluidd/Mainsail's Outputs panel. virtual_pin as on
# Simple AF; mainline Klipper has no virtual pins: leave the
# [output_pin] sections out (or use a plugin that provides virtual pins).
# Without a pin the macros read the saved variable instead, e.g.
#   SAVE_VARIABLE VARIABLE=sw_lidar_mesh VALUE=1
# (sw_first_layer_check, sw_first_layer_learn, sw_lidar_mesh; see
# _LIDAR_SWITCHES). _LIDAR_SWITCHES below keeps the pins across restarts.
#
# First_Layer_Check: scan the bare plate under the objects before the purge
#   and the first layer when layer 2 starts, report the real thickness
# First_Layer_Learn: apply the Z offset learned per filament from the checks
# LiDAR_Mesh: START_PRINT meshes with the LiDAR instead of the probe
# LiDAR_Camera: the module's IR camera as a webcam (lidar-direct.py
#   --camera-port 8081, http://printer:8081/): pictures and the fill light
#   only while this is on. Without the pin start the driver with
#   --camera-switch none (camera always available)
[output_pin First_Layer_Check]
pin: virtual_pin:first_layer_check_pin
value: 0

[output_pin First_Layer_Learn]
pin: virtual_pin:first_layer_learn_pin
value: 0

[output_pin LiDAR_Mesh]
pin: virtual_pin:lidar_mesh_pin
value: 0

[output_pin LiDAR_Camera]
pin: virtual_pin:lidar_camera_pin
value: 0

# output pin -> saved variable. Switches that don't exist are skipped (the
# last two come from k1max/k1max-extras.cfg).
[gcode_macro _LIDAR_SWITCHES]
variable_map: {"First_Layer_Check": "sw_first_layer_check", "First_Layer_Learn": "sw_first_layer_learn", "LiDAR_Mesh": "sw_lidar_mesh", "LiDAR_Camera": "sw_lidar_camera", "True_Zero_Touch": "sw_nozzle_touch", "Nozzle_Deep_Clean": "sw_nozzle_wipe"}
gcode:

[delayed_gcode _LIDAR_SWITCHES_RESTORE]
initial_duration: 1
gcode:
    {% set saved = printer.save_variables.variables %}
    {% for pin, var in printer["gcode_macro _LIDAR_SWITCHES"].map.items() %}
      {% if var in saved and ("output_pin " ~ pin) in printer %}
        SET_PIN PIN={pin} VALUE={saved[var]}
      {% endif %}
    {% endfor %}
    # pressure advance measured by the LiDAR (or its camera) for the loaded
    # filament (LIDAR_PA_CALIBRATION / LIDAR_PA_SAVE save it; clear it in
    # your UNLOAD_FILAMENT with SAVE_VARIABLE VARIABLE=lidar_pa VALUE=None)
    {% if saved.lidar_pa is defined and saved.lidar_pa is not none %}
      SET_PRESSURE_ADVANCE ADVANCE={saved.lidar_pa}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_LIDAR_SWITCHES_SAVE DURATION=5

# the Outputs panel calls SET_PIN directly: save whatever changed
[delayed_gcode _LIDAR_SWITCHES_SAVE]
gcode:
    {% set saved = printer.save_variables.variables %}
    {% for pin, var in printer["gcode_macro _LIDAR_SWITCHES"].map.items() %}
      {% if ("output_pin " ~ pin) in printer %}
        {% set now = printer["output_pin " ~ pin].value | int %}
        {% if saved[var] | default(-1) | int != now %}
          SAVE_VARIABLE VARIABLE={var} VALUE={now}
        {% endif %}
      {% endif %}
    {% endfor %}
    UPDATE_DELAYED_GCODE ID=_LIDAR_SWITCHES_SAVE DURATION=5

# --------------------------------------------------------------- print hooks

# Call from START_PRINT before anything else: forgets a first-layer check
# left over from a cancelled print.
[gcode_macro _LIDAR_PRINT_START]
gcode:
    FIRST_LAYER_SCAN PHASE=cancel

# Call from START_PRINT instead of BED_MESH_CALIBRATE. With LiDAR_Mesh on the
# LiDAR meshes the printed objects plus the zero reference spot (the LiDAR has
# no absolute height, the mesh is made 0 where Z is homed/touched); when it
# can't (objects out of its reach, service down, a failed scan) the probe
# meshes instead and the print goes on (FALLBACK=1).
[gcode_macro _LIDAR_START_PRINT_MESH]
gcode:
    {% set adaptive = params.ADAPTIVE|default(1)|int %}
    {% set pin = "output_pin LiDAR_Mesh" %}
    {% set on = printer[pin].value if pin in printer else printer.save_variables.variables.sw_lidar_mesh|default(0) %}
    {% if on|float > 0 %}
      {% set level = printer["gcode_macro LIDAR_MESH"].print_level|int %}
      LIDAR_BED_MESH LEVEL={level} ADAPTIVE={adaptive} FALLBACK=1
    {% else %}
      BED_MESH_CALIBRATE ADAPTIVE={adaptive}
    {% endif %}

# Call from START_PRINT after the mesh and the nozzle touch, before it heats
# to print temperature and purges (nothing oozes onto the plate while it is
# scanned). Pass START_PRINT's parameters on: _LIDAR_PRINT_SCAN {rawparams}
# lidar_pa_test.gcode (LIDAR_PA_CALIBRATION without the helper) sets its
# own area; lidar_pa_flow_test.gcode (LIDAR_PA_CALIBRATION /
# LIDAR_FLOW_CALIBRATION with the helper) runs its bare step here (exposure,
# plate photo, bare strips; it cools the nozzle itself); any other print
# gets the first-layer check when First_Layer_Check is on. Only in a file
# print: START_PRINT run from a command (CREALITY_PA_TEST,
# LIDAR_OFFSET_CALIBRATION) sees the last job's filename. The slicer's
# START_PRINT line should pass FIRST_LAYER_HEIGHT=, FILAMENT_TYPE= and
# FILAMENT_NAME= (OrcaSlicer: FIRST_LAYER_HEIGHT=[initial_layer_print_height]
# FILAMENT_TYPE={filament_type[initial_extruder]}
# FILAMENT_NAME="{filament_settings_id[initial_extruder]}").
[gcode_macro _LIDAR_PRINT_SCAN]
variable_x: 0
variable_y0: 0
variable_y1: 0
gcode:
    {% set pin = "output_pin First_Layer_Check" %}
    {% set check = printer[pin].value if pin in printer else printer.save_variables.variables.sw_first_layer_check|default(0) %}
    {% set in_print = printer.print_stats.state in ["printing", "paused"] %}
    {% if in_print and printer.print_stats.filename == "lidar_pa_flow_test.gcode" %}
      LIDAR_PA_FLOW_STEP STEP=BARE
    {% elif in_print and printer.print_stats.filename == "lidar_pa_test.gcode" and y1 > y0 %}
      M104 S{[printer.extruder.target, 150]|min}
      LIDAR_SCAN NAME=pa_base X={x} Y0={y0} Y1={y1}
    {% elif in_print and check|float > 0 %}
      M104 S{[printer.extruder.target, 150]|min}
      FIRST_LAYER_SCAN PHASE=before HEIGHT={params.FIRST_LAYER_HEIGHT|default(0.2)|float} FILAMENT_TYPE="{params.FILAMENT_TYPE|default('')}" FILAMENT_NAME="{params.FILAMENT_NAME|default('')}"
    {% endif %}

# First_Layer_Learn: the Z offset learned per filament (fl_zoffset in
# variables.cfg). Call from START_PRINT right after the nozzle touch / Z
# calibration, with START_PRINT's parameters. Klipper keeps a G-code offset
# across prints, so a filament without one gets 0.
[gcode_macro _FIRST_LAYER_OFFSET]
gcode:
    {% set name = params.FILAMENT_NAME|default('') or params.FILAMENT_TYPE|default('') or 'unknown' %}
    {% set key = name|replace(' ', '_')|replace('"', '')|replace("'", '') %}
    {% set saved = printer.save_variables.variables.fl_zoffset|default({}) %}
    {% set pin = "output_pin First_Layer_Learn" %}
    {% set learn = printer[pin].value if pin in printer else printer.save_variables.variables.sw_first_layer_learn|default(0) %}
    {% if learn|float > 0 %}
      {% set z = saved[key]|default(0.0)|float %}
      SET_GCODE_OFFSET Z={z}
      RESPOND TYPE=command MSG="First layer: Z offset {'%+.3f' % z} for {key}{'' if key in saved else ' (nothing learned yet)'}"
    {% endif %}

# Flow measured by LIDAR_FLOW_CALIBRATION (EXPERIMENTAL: one-layer bands at
# 92..112 % judged by the camera or the LiDAR; by default a benchmark that
# saves nothing until LIDAR_FLOW_SAVE METHOD=IR|LIDAR), per filament name as
# the slicer passes it (lidar_flow):
# applied as M221. Call from START_PRINT after the nozzle touch, with
# START_PRINT's parameters. Always sets M221 (Klipper keeps it across
# prints): 100 for a filament without a saved flow. Keep the slicer's flow
# ratio at 1.0 for filaments with one. The measurement assumed the
# first-layer gap the filament's fl_zoffset gave at the time (z); when the
# first-layer check has since learned that the nozzle sat higher or lower,
# the flow follows: f + dfdh * (z - z now). Also remembers the filament
# name (last_filament_name, the LiDAR calibrations' default filament).
[gcode_macro _LIDAR_FLOW_APPLY]
gcode:
    {% set name = params.FILAMENT_NAME|default('') or params.FILAMENT_TYPE|default('') or 'unknown' %}
    {% set key = name|replace(' ', '_')|replace('"', '')|replace("'", '') %}
    {% set v = printer.save_variables.variables %}
    {% set saved = v.lidar_flow|default({}) %}
    {% set zs = v.fl_zoffset|default({}) %}
    {% if printer.print_stats.state in ["printing", "paused"] and printer.print_stats.filename == "lidar_pa_flow_test.gcode" %}
      M221 S100
    {% elif key in saved and saved[key] is mapping %}
      {% set e = saved[key] %}
      {% set corr = e.dfdh|default(0.0)|float * (e.z|default(0.0)|float - zs[key]|default(0.0)|float) %}
      {% set f = [[e.f|float + corr, 0.8]|max, 1.2]|min %}
      M221 S{'%.1f' % (100.0 / f)}
      RESPOND TYPE=command MSG="Flow {'%.3f' % f} for {key} (measured {'%.3f' % e.f|float}, first-layer correction {'%+.3f' % corr}): M221 S{'%.1f' % (100.0 / f)}"
    {% elif key in saved %}
      M221 S{'%.1f' % (100.0 / saved[key]|float)}
      RESPOND TYPE=command MSG="Flow {'%.3f' % saved[key]|float} measured for {key}: M221 S{'%.1f' % (100.0 / saved[key]|float)}"
    {% else %}
      M221 S100
    {% endif %}
    {% if params.FILAMENT_NAME|default('') and v.last_filament_name|default('') != key %}
      SAVE_VARIABLE VARIABLE=last_filament_name VALUE="'{key}'"
    {% endif %}

# The slicer's layer change G-code, at layer 2 only. OrcaSlicer:
#   {if layer_num == 1}_FIRST_LAYER_AFTER
#   {endif}
# After the scan pause the nozzle has oozed: prime_tip mm refill it, then a
# prime_purge mm purge line (like the start purge; _KAMP_Settings height and
# flow if you have them) in front of the objects, else beside or behind
# them; 0 and 0 = no prime.
[gcode_macro _FIRST_LAYER_AFTER]
variable_prime_tip: 5
variable_prime_purge: 20
gcode:
    {% if printer.lidar.first_layer_armed %}
      FIRST_LAYER_SCAN PHASE=after TIP={prime_tip} PRIME={prime_purge}
    {% endif %}

# Call from END_PRINT before it moves away: a one-layer print never reaches
# layer 2, so it is checked here (file prints only, not END_PRINT from
# CREALITY_PA_TEST / LIDAR_OFFSET_CALIBRATION).
[gcode_macro _LIDAR_PRINT_END]
gcode:
    {% if printer.lidar.first_layer_armed and printer.print_stats.state in ["printing", "paused"] %}
      FIRST_LAYER_SCAN PHASE=after FINAL=1
    {% endif %}

# Call from CANCEL_PRINT. A cancelled PA/flow calibration print leaves its
# last test PA (and maybe M221) active: back to the saved LiDAR PA or the
# config default, flow 100 %.
[gcode_macro _LIDAR_PRINT_CANCEL]
gcode:
    FIRST_LAYER_SCAN PHASE=cancel
    {% set ps = printer.print_stats %}
    {% if ps.state in ["printing", "paused"] and ps.filename == "lidar_pa_flow_test.gcode" %}
      {% set pa = printer.save_variables.variables.lidar_pa | default(None) %}
      {% if pa is none %}
        {% set pa = printer.configfile.settings.extruder.pressure_advance | default(0) %}
      {% endif %}
      SET_PRESSURE_ADVANCE ADVANCE={pa}
      M221 S100
      RESPOND TYPE=command MSG="Calibration print cancelled: pressure advance back to {pa}, flow 100 %"
    {% endif %}

# --------------------------------------------------------------- bed mesh

# LiDAR bed mesh levels (LIDAR_BED_MESH LEVEL=), full bed on a K1 Max:
#   1 quick     7x7, moving 150mm/s            ~20 s
#   2 fast      12x12, moving 120mm/s          ~40 s
#   3 normal    20x20, moving 60mm/s           ~1.7 min
#   4 fine      30x30, strips, whole line      ~4.8 min
#   5 ultimate  fine + 5x5 nozzle touches      ~13 min
# MOTION=dwell stands at the points instead (levels 1-3). variable_level is
# the default for LIDAR_MESH, variable_print_level the one
# _LIDAR_START_PRINT_MESH uses when the LiDAR_Mesh switch is on.
[gcode_macro LIDAR_MESH]
description: LiDAR bed mesh at the default level (variable_level) or LEVEL=1-5; ADAPTIVE=1 meshes only the printed objects
variable_level: 2
variable_print_level: 3
gcode:
    {% set args = [] %}
    {% for k, v in params.items() if k != "LEVEL" %}
      {% set _ = args.append(k ~ "=" ~ v) %}
    {% endfor %}
    LIDAR_BED_MESH LEVEL={params.LEVEL|default(level)|int} {args|join(" ")}

# Nozzle to [lidar] touch_temp (default 150C: hot enough to soften ooze,
# cool enough not to mark the plate), then [lidar] touch_wipe_gcode if set.
[gcode_macro _LIDAR_TOUCH_TEMP]
gcode:
    {% set cfg = printer.configfile.settings.lidar %}
    M109 S{cfg.touch_temp|default(150)}
    {% if params.WIPE|default(1)|int == 1 and cfg.touch_wipe_gcode %}
      {cfg.touch_wipe_gcode}
    {% endif %}

# Both LiDAR tables for its bed meshes in one go: the X-beam twist and the
# error along Y, or both from a grid (GRID=7,5: nozzle taps and the LiDAR on
# every point, after Axis Twist Mesh by sterling5241). Every run is kept with
# its bed temperature (lidar_cal_by_temp) and meshes use the mean of the runs
# on a hot (>= 45C) or a cold bed. BED_TEMPS=60,70,100 heats, soaks
# SOAK= minutes (default 10) and calibrates at each. Runs are kept per plate:
# LIDAR_PLATE NAME=smooth_pei before calibrating a new plate, and meshes use
# only the current plate's runs. RESET=1 forgets the current plate's earlier
# runs and the untagged ones (other plates' stay): do it after changing the
# LiDAR mount or the gantry. AXIS=X or AXIS=Y measures one line only (the
# other parameters go to LIDAR_TWIST_CALIBRATE: POINTS=, PASSES=, X=, Y=).
[gcode_macro LIDAR_MESH_CALIBRATION]
description: Calibrate the LiDAR bed mesh against nozzle touches (~16 min per run; GRID=7,5 ~25 min; AXIS=X or Y one line; BED_TEMPS=60,70,100 several bed temperatures; RESET=1 forgets this plate's runs (LIDAR_PLATE); clear plate)
gcode:
    {% set axis = params.AXIS|default('')|string|upper %}
    {% if axis not in ['', 'X', 'Y'] or (axis and params.GRID) %}
      RESPOND TYPE=error MSG="LIDAR_MESH_CALIBRATION: AXIS=X or AXIS=Y (one line), not together with GRID="
    {% else %}
    {% set extruder_target = printer.extruder.target %}
    {% set bed_target = printer.heater_bed.target %}
    {% set soak = params.SOAK|default(10)|float %}
    {% set ns1 = namespace(extra=[]) %}
    {% for k, v in params.items() if k not in ['AXIS', 'GRID', 'BED_TEMPS', 'RESET', 'WIPE', 'SOAK'] %}
      {% set ns1.extra = ns1.extra + [k ~ "=" ~ v] %}
    {% endfor %}
    {% set ns = namespace(temps=[]) %}
    {% for t in (params.BED_TEMPS|default('')|string).split(',') %}
      {% if t|trim %}
        {% set ns.temps = ns.temps + [t|trim|float] %}
      {% endif %}
    {% endfor %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    {% if params.RESET|default(0)|int == 1 %}
      LIDAR_PLATE RESET_RUNS=1
    {% endif %}
    # ascending, so the bed only heats
    {% for t in (ns.temps|sort or [None]) %}
      {% if t is not none %}
        RESPOND TYPE=command MSG="LiDAR mesh calibration at bed {'%.0f' % t}C"
        M190 S{t}
        G4 P{(soak * 60000)|int}
      {% endif %}
      _LIDAR_TOUCH_TEMP WIPE={params.WIPE|default(1)}
      {% if params.GRID %}
        LIDAR_GRID_CALIBRATE COUNT={params.GRID}
      {% elif axis %}
        LIDAR_TWIST_CALIBRATE AXIS={axis} {ns1.extra|join(" ")}
      {% else %}
        LIDAR_TWIST_CALIBRATE AXIS=X
        LIDAR_TWIST_CALIBRATE AXIS=Y
      {% endif %}
    {% endfor %}
    {% if ns.temps %}
      M140 S{bed_target}
    {% endif %}
    M104 S{extruder_target}
    RESPOND TYPE=command MSG="LiDAR mesh calibration saved (lidar_cal_by_temp)"
    {% endif %}

[gcode_macro MESH_BENCHMARK_RUN]
description: Heat the bed (BED_TEMP, default 70), soak SOAK= minutes (default 10), then MESH_BENCHMARK (METHODS=probe,1,2,3,4,5,repeat2 TRUTH=6; ~55 min for all)
gcode:
    {% set args = [] %}
    {% for k, v in params.items() if k not in ["BED_TEMP", "SOAK"] %}
      {% set _ = args.append(k ~ "=" ~ v) %}
    {% endfor %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    M190 S{params.BED_TEMP|default(70)|float}
    G4 P{(params.SOAK|default(10)|float * 60000)|int}
    MESH_BENCHMARK {args|join(" ")}

# --------------------------------------------------------------- calibration prints

# Calibration prints. With the helper (numpy + PIL, not service_local) PA
# and flow are measured on LIDAR_PA_FLOW_CALIBRATE prints planned by the
# helper: METHOD=IR with the LiDAR's camera, LIDAR with LiDAR strips (bare
# plate before, the print after), BOTH with both = a benchmark: nothing is
# saved, Fluidd/Mainsail ask which result to save (LIDAR_PA_SAVE /
# LIDAR_FLOW_SAVE METHOD=IR|LIDAR). Without the helper LIDAR_PA_CALIBRATION
# prints the LiDAR-only PA test instead. X=/Y= place a print; without them
# the K1 Max spot (X100 Y35) if it fits, else centred in the travel.
# FILAMENT_NAME empty = the last printed filament (the flow is saved under
# that name). Both in one print, typed only:
#   LIDAR_PA_FLOW_CALIBRATE TESTS=PA,FLOW PA_METHOD= FLOW_METHOD= ...
[gcode_macro LIDAR_PA_CALIBRATION]
description: Print 9 PA lines, measure them (METHOD=IR camera, LIDAR scans, BOTH = benchmark, nothing saved until LIDAR_PA_SAVE; default IR with the camera) and save pressure advance (clear plate, the console says where)
gcode:
    {% set method = params.METHOD|default('')|string|upper %}
    {% if method not in ['', 'IR', 'LIDAR', 'BOTH'] %}
      RESPOND TYPE=error MSG="LIDAR_PA_CALIBRATION: METHOD=IR, LIDAR or BOTH"
    {% else %}
      {% set args = [] %}
      {% for k, v in params.items() if k not in ["EXTRUDER_TEMP", "BED_TEMP", "METHOD", "FILAMENT_NAME", "FILAMENT_TYPE"] %}
        {% set _ = args.append(k ~ "=" ~ v) %}
      {% endfor %}
      {% if method %}
        {% set _ = args.append("METHOD=" ~ method) %}
      {% endif %}
      LIDAR_PA_CALIBRATE EXTRUDER_TEMP={params.EXTRUDER_TEMP|default(210)|float} BED_TEMP={params.BED_TEMP|default(60)|float} FILAMENT_NAME="{params.FILAMENT_NAME|default('')}" FILAMENT_TYPE="{params.FILAMENT_TYPE|default('')}" {args|join(" ")}
    {% endif %}

# EXPERIMENTAL (the camera read ~4 % low against a printed check on the K1
# Max): 6 one-layer bands at 92..112 %, the first closed and smooth one is
# the flow. Default METHOD=BOTH: nothing saved, LIDAR_FLOW_SAVE picks; IR or
# LIDAR saves that method's result (lidar_flow, applied by
# _LIDAR_FLOW_APPLY). Needs the helper (numpy + PIL).
[gcode_macro LIDAR_FLOW_CALIBRATION]
description: EXPERIMENTAL - print 6 one-layer flow bands (92-112 %) and judge them; default METHOD=BOTH (camera and LiDAR, nothing saved, LIDAR_FLOW_SAVE picks); IR or LIDAR saves that one (clear plate, the console says where)
gcode:
    {% set method = params.METHOD|default('BOTH')|string|upper %}
    {% if method not in ['IR', 'LIDAR', 'BOTH'] %}
      RESPOND TYPE=error MSG="LIDAR_FLOW_CALIBRATION: METHOD=IR, LIDAR or BOTH"
    {% else %}
      {% set args = [] %}
      {% for k, v in params.items() if k not in ["EXTRUDER_TEMP", "BED_TEMP", "METHOD", "FILAMENT_NAME", "FILAMENT_TYPE"] %}
        {% set _ = args.append(k ~ "=" ~ v) %}
      {% endfor %}
      LIDAR_PA_FLOW_CALIBRATE TESTS=FLOW FLOW_METHOD={method} EXTRUDER_TEMP={params.EXTRUDER_TEMP|default(210)|float} BED_TEMP={params.BED_TEMP|default(60)|float} FILAMENT_NAME="{params.FILAMENT_NAME|default('')}" FILAMENT_TYPE="{params.FILAMENT_TYPE|default('')}" {args|join(" ")}
    {% endif %}

[gcode_macro LIDAR_OFFSET_CALIBRATION]
description: Print a small cross, scan it (and photograph it, with the helper) at Z3 and Z5 and save where the LiDAR looks (needs a clear plate around X135-165 Y133-167)
gcode:
    {% set extruder_temp = params.EXTRUDER_TEMP|default(250)|float %}
    {% set bed_temp = params.BED_TEMP|default(70)|float %}
    {% set x = params.X|default(150)|float %}
    {% set y = params.Y|default(150)|float %}
    {% set apply = params.APPLY|default(1)|int %}
    LIDAR_OFFSET_CALIBRATE EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp} X={x} Y={y} APPLY={apply}

[gcode_macro CREALITY_PA_TEST]
description: Print Creality's pressure advance test pattern, 20 PA values 0.020-0.096, read by eye (needs a clear plate around X170-204 Y60-199)
gcode:
    {% set extruder_temp = params.EXTRUDER_TEMP|default(250)|float %}
    {% set bed_temp = params.BED_TEMP|default(70)|float %}
    {% set x = params.X|default(170)|float %}
    {% set y = params.Y|default(60)|float %}
    {% set pa_start = params.PA_START|default(0.02)|float %}
    {% set pa_step = params.PA_STEP|default(0.004)|float %}
    LIDAR_PA_CREALITY EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp} X={x} Y={y} PA_START={pa_start} PA_STEP={pa_step}
