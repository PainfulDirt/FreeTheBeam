# Example Klipper/Kalico config for klipper/lidar.py (FreeTheBeam).
#
# Paste the parts you need into your printer config. The values are from a
# K1 Max with a glass bed + textured PEI; run LIDAR_OFFSET_CALIBRATION for
# your own mount (it saves its result in variables.cfg, which overrides
# x_offset/y_offset here).
#
# Needs:
#   - lidar.py linked into klippy/plugins (docs/install-k1max.md)
#   - [save_variables] (calibrations, tables and switches are stored there)
#   - [gcode_shell_command] (Kalico and Simple AF have it) for LIDAR_DRIVER
#   - [exclude_object] and a slicer that labels objects, for ADAPTIVE=1
#     meshes and the first-layer check
#   - the helper service (`service:` below, docs/install-helper.md) for bed
#     meshes, the first-layer check and dwell scans
#   - [load_cell_probe] (Kalico, K1 load cells) for everything that touches
#     the bed with the nozzle: LIDAR_TWIST_CALIBRATE, LIDAR_GRID_CALIBRATE,
#     LIDAR_BED_MESH LEVEL=5, MESH_BENCHMARK
#
# The full command reference is the comment block at the top of lidar.py.

[lidar]
x_offset: -36
y_offset: -21.2
x_dir: -1
# captures and analysis on a helper computer (helper/lidar_service.py);
# leave commented out to do only the basic scans on the printer
#service: HELPER_IP:7131
# dwell scans locked to the frames: a row = settle + the ~0.11s a frame covers
# + 2x margin + the move, which must fit one frame (0.2s, run LIDAR_TIMING)
dwell_settle: 0.03
dwell_margin: 0.01

# --------------------------------------------------------------- driver

# K1 Max only: starts the driver (k1max/lidar-start.sh). Change the path to
# where you put this repo.
[gcode_shell_command k1_lidar_start]
command: /usr/data/FreeTheBeam/k1max/lidar-start.sh
timeout: 60
verbose: True

[gcode_macro LIDAR_DRIVER]
description: Restart the LiDAR driver; DRIVER=direct (open driver, default) or DRIVER=middleware (Creality's, fallback)
gcode:
    {% set d = params.DRIVER|default('direct')|lower %}
    {% if d not in ['direct', 'middleware'] %}
        RESPOND TYPE=error MSG="LIDAR_DRIVER: DRIVER=direct or DRIVER=middleware"
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
        RESPOND TYPE=error MSG="LIDAR_DRIVER: not while printing"
    {% else %}
        {% if printer.save_variables.variables.lidar_driver|default('direct') != d %}
            SAVE_VARIABLE VARIABLE=lidar_driver VALUE="'{d}'"
        {% endif %}
        RUN_SHELL_COMMAND CMD=k1_lidar_start
    {% endif %}

# --------------------------------------------------------------- switches

# On/off switches in Fluidd/Mainsail's Outputs panel. virtual_pin as on
# Simple AF; use whatever your setup offers for a dummy output pin.
# _LIDAR_SWITCHES below keeps them across restarts.
#
# First_Layer_Check: scan the bare plate under the objects before the purge
#   and the first layer when layer 2 starts, report the real thickness
# First_Layer_Learn: apply the Z offset learned per filament from the checks
# LiDAR_Mesh: START_PRINT meshes with the LiDAR instead of the probe
[output_pin First_Layer_Check]
pin: virtual_pin:first_layer_check_pin
value: 0

[output_pin First_Layer_Learn]
pin: virtual_pin:first_layer_learn_pin
value: 0

[output_pin LiDAR_Mesh]
pin: virtual_pin:lidar_mesh_pin
value: 0

# output pin -> saved variable. Switches that don't exist are skipped (the
# last two come from k1max/k1max-extras.cfg).
[gcode_macro _LIDAR_SWITCHES]
variable_map: {"First_Layer_Check": "sw_first_layer_check", "First_Layer_Learn": "sw_first_layer_learn", "LiDAR_Mesh": "sw_lidar_mesh", "True_Zero_Touch": "sw_nozzle_touch", "Nozzle_Deep_Clean": "sw_nozzle_wipe"}
gcode:

[delayed_gcode _LIDAR_SWITCHES_RESTORE]
initial_duration: 1
gcode:
    {% set saved = printer.save_variables.variables %}
    {% for pin, var in printer["gcode_macro _LIDAR_SWITCHES"].map.items() %}
      {% if var in saved and ("output_pin " ~ pin) in printer %}
        SET_PIN PIN={pin} VALUE={saved[var]}
      {% endif %}
    {% endfor %}
    # pressure advance measured by the LiDAR for the loaded filament
    # (LIDAR_PA_CALIBRATION saves it; clear it in your UNLOAD_FILAMENT with
    # SAVE_VARIABLE VARIABLE=lidar_pa VALUE=None)
    {% if saved.lidar_pa is defined and saved.lidar_pa is not none %}
      SET_PRESSURE_ADVANCE ADVANCE={saved.lidar_pa}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_LIDAR_SWITCHES_SAVE DURATION=5

# the Outputs panel calls SET_PIN directly: save whatever changed
[delayed_gcode _LIDAR_SWITCHES_SAVE]
gcode:
    {% set saved = printer.save_variables.variables %}
    {% for pin, var in printer["gcode_macro _LIDAR_SWITCHES"].map.items() %}
      {% if ("output_pin " ~ pin) in printer %}
        {% set now = printer["output_pin " ~ pin].value | int %}
        {% if saved[var] | default(-1) | int != now %}
          SAVE_VARIABLE VARIABLE={var} VALUE={now}
        {% endif %}
      {% endif %}
    {% endfor %}
    UPDATE_DELAYED_GCODE ID=_LIDAR_SWITCHES_SAVE DURATION=5

# --------------------------------------------------------------- print hooks

# Call from START_PRINT before anything else: forgets a first-layer check
# left over from a cancelled print.
[gcode_macro _LIDAR_PRINT_START]
gcode:
    FIRST_LAYER_SCAN PHASE=cancel

# Call from START_PRINT instead of BED_MESH_CALIBRATE. With LiDAR_Mesh on the
# LiDAR meshes the printed objects plus the zero reference spot (the LiDAR has
# no absolute height, the mesh is made 0 where Z is homed/touched); when it
# can't (objects out of its reach, service down, a failed scan) the probe
# meshes instead and the print goes on (FALLBACK=1).
[gcode_macro _LIDAR_START_PRINT_MESH]
gcode:
    {% set adaptive = params.ADAPTIVE|default(1)|int %}
    {% if printer['output_pin LiDAR_Mesh'].value > 0 %}
      {% set level = printer["gcode_macro LIDAR_MESH"].print_level|int %}
      LIDAR_BED_MESH LEVEL={level} ADAPTIVE={adaptive} FALLBACK=1
    {% else %}
      BED_MESH_CALIBRATE ADAPTIVE={adaptive}
    {% endif %}

# Call from START_PRINT after the mesh and the nozzle touch, before it heats
# to print temperature and purges (nothing oozes onto the plate while it is
# scanned). Pass START_PRINT's parameters on: _LIDAR_PRINT_SCAN {rawparams}
# lidar_pa_test.gcode (LIDAR_PA_CALIBRATION) sets its own area; any other
# print gets the first-layer check when First_Layer_Check is on. The slicer's
# START_PRINT line should pass FIRST_LAYER_HEIGHT=, FILAMENT_TYPE= and
# FILAMENT_NAME= (OrcaSlicer: FIRST_LAYER_HEIGHT=[initial_layer_print_height]
# FILAMENT_TYPE={filament_type[initial_extruder]}
# FILAMENT_NAME="{filament_settings_id[initial_extruder]}").
[gcode_macro _LIDAR_PRINT_SCAN]
variable_x: 0
variable_y0: 0
variable_y1: 0
gcode:
    {% if printer.print_stats.filename == "lidar_pa_test.gcode" and y1 > y0 %}
      M104 S{[printer.extruder.target, 150]|min}
      LIDAR_SCAN NAME=pa_base X={x} Y0={y0} Y1={y1}
    {% elif printer['output_pin First_Layer_Check'].value > 0 %}
      M104 S{[printer.extruder.target, 150]|min}
      FIRST_LAYER_SCAN PHASE=before HEIGHT={params.FIRST_LAYER_HEIGHT|default(0.2)|float} FILAMENT_TYPE="{params.FILAMENT_TYPE|default('')}" FILAMENT_NAME="{params.FILAMENT_NAME|default('')}"
    {% endif %}

# First_Layer_Learn: the Z offset learned per filament (fl_zoffset in
# variables.cfg). Call from START_PRINT right after the nozzle touch / Z
# calibration, with START_PRINT's parameters. Klipper keeps a G-code offset
# across prints, so a filament without one gets 0.
[gcode_macro _FIRST_LAYER_OFFSET]
gcode:
    {% set name = params.FILAMENT_NAME|default('') or params.FILAMENT_TYPE|default('') or 'unknown' %}
    {% set key = name|replace(' ', '_')|replace('"', '')|replace("'", '') %}
    {% set saved = printer.save_variables.variables.fl_zoffset|default({}) %}
    {% if printer['output_pin First_Layer_Learn'].value > 0 %}
      {% set z = saved[key]|default(0.0)|float %}
      SET_GCODE_OFFSET Z={z}
      RESPOND TYPE=command MSG="First layer: Z offset {'%+.3f' % z} for {key}{'' if key in saved else ' (nothing learned yet)'}"
    {% endif %}

# The slicer's layer change G-code, at layer 2 only. OrcaSlicer:
#   {if layer_num == 1}_FIRST_LAYER_AFTER
#   {endif}
[gcode_macro _FIRST_LAYER_AFTER]
gcode:
    {% if printer.lidar.first_layer_armed %}
      FIRST_LAYER_SCAN PHASE=after
    {% endif %}

# Call from END_PRINT before it moves away: a one-layer print never reaches
# layer 2, so it is checked here.
[gcode_macro _LIDAR_PRINT_END]
gcode:
    {% if printer.lidar.first_layer_armed %}
      FIRST_LAYER_SCAN PHASE=after FINAL=1
    {% endif %}

# Call from CANCEL_PRINT.
[gcode_macro _LIDAR_PRINT_CANCEL]
gcode:
    FIRST_LAYER_SCAN PHASE=cancel

# --------------------------------------------------------------- bed mesh

# LiDAR bed mesh levels (LIDAR_BED_MESH LEVEL=), full bed on a K1 Max:
#   1 quick     7x7, moving 150mm/s            ~20 s
#   2 fast      12x12, moving 120mm/s          ~40 s
#   3 normal    20x20, moving 60mm/s           ~1.7 min
#   4 fine      30x30, strips, whole line      ~4.8 min
#   5 ultimate  fine + 5x5 nozzle touches      ~13 min
# MOTION=dwell stands at the points instead (levels 1-3). variable_level is
# the default for LIDAR_MESH, variable_print_level the one
# _LIDAR_START_PRINT_MESH uses when the LiDAR_Mesh switch is on.
[gcode_macro LIDAR_MESH]
description: LiDAR bed mesh at the default level (variable_level) or LEVEL=1-5; ADAPTIVE=1 meshes only the printed objects
variable_level: 2
variable_print_level: 3
gcode:
    {% set args = [] %}
    {% for k, v in params.items() if k != "LEVEL" %}
      {% set _ = args.append(k ~ "=" ~ v) %}
    {% endfor %}
    LIDAR_BED_MESH LEVEL={params.LEVEL|default(level)|int} {args|join(" ")}

# Nozzle temperature for the touches: the touch_temp of a _LOAD_CELL_TOUCH_Z
# macro if you have one (Simple AF load-cell setups), otherwise 150C (hot
# enough to soften ooze, cool enough not to mark the plate).
[gcode_macro _LIDAR_TOUCH_TEMP]
gcode:
    {% if "gcode_macro _LOAD_CELL_TOUCH_Z" in printer %}
      M109 S{printer["gcode_macro _LOAD_CELL_TOUCH_Z"].touch_temp|default(150)}
    {% else %}
      M109 S150
    {% endif %}
    # optional: a nozzle wipe macro of yours, run before the touches
    {% if params.WIPE|default(1)|int == 1 and "gcode_macro _TOUCH_NOZZLE_WIPE" in printer %}
      _TOUCH_NOZZLE_WIPE
    {% endif %}

[gcode_macro LIDAR_TWIST_CALIBRATION]
description: Measure the LiDAR against nozzle touches (load cells) for LIDAR_BED_MESH; AXIS=X (default) the X-beam twist along Y145, AXIS=Y its error along Y (lines at X100 and X200) (homed, clear plate there)
gcode:
    {% set extruder_target = printer.extruder.target %}
    _LIDAR_TOUCH_TEMP WIPE={params.WIPE|default(1)}
    # the bed stays hot; its heater is off only for each touch
    LIDAR_TWIST_CALIBRATE {rawparams}
    M104 S{extruder_target}

# Both LiDAR tables for its bed meshes in one go: the X-beam twist and the
# error along Y, or both from a grid (GRID=7,5: nozzle taps and the LiDAR on
# every point, after Axis Twist Mesh by sterling5241). Every run is kept with
# its bed temperature (lidar_cal_by_temp) and meshes use the mean of the runs
# on a hot (>= 45C) or a cold bed. BED_TEMPS=60,70,100 heats, soaks
# SOAK= minutes (default 10) and calibrates at each. RESET=1 forgets the
# earlier runs: do it after changing the plate, the LiDAR mount or the gantry.
[gcode_macro LIDAR_MESH_CALIBRATION]
description: Calibrate the LiDAR bed mesh against nozzle touches (~16 min per run; GRID=7,5 ~25 min; BED_TEMPS=60,70,100 several bed temperatures; RESET=1 after hardware changes; clear plate)
gcode:
    {% set extruder_target = printer.extruder.target %}
    {% set bed_target = printer.heater_bed.target %}
    {% set soak = params.SOAK|default(10)|float %}
    {% set ns = namespace(temps=[]) %}
    {% for t in (params.BED_TEMPS|default('')|string).split(',') %}
      {% if t|trim %}
        {% set ns.temps = ns.temps + [t|trim|float] %}
      {% endif %}
    {% endfor %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    {% if params.RESET|default(0)|int == 1 %}
      SAVE_VARIABLE VARIABLE=lidar_cal_by_temp VALUE="{{}}"
      RESPOND TYPE=command MSG="LiDAR mesh calibration: earlier runs cleared"
    {% endif %}
    # ascending, so the bed only heats
    {% for t in (ns.temps|sort or [None]) %}
      {% if t is not none %}
        RESPOND TYPE=command MSG="LiDAR mesh calibration at bed {'%.0f' % t}C"
        M190 S{t}
        G4 P{(soak * 60000)|int}
      {% endif %}
      _LIDAR_TOUCH_TEMP WIPE={params.WIPE|default(1)}
      {% if params.GRID %}
        LIDAR_GRID_CALIBRATE COUNT={params.GRID}
      {% else %}
        LIDAR_TWIST_CALIBRATE AXIS=X
        LIDAR_TWIST_CALIBRATE AXIS=Y
      {% endif %}
    {% endfor %}
    {% if ns.temps %}
      M140 S{bed_target}
    {% endif %}
    M104 S{extruder_target}
    RESPOND TYPE=command MSG="LiDAR mesh calibration saved (lidar_cal_by_temp)"

[gcode_macro MESH_BENCHMARK_RUN]
description: Heat the bed (BED_TEMP, default 70), soak SOAK= minutes (default 10), then MESH_BENCHMARK (METHODS=probe,1,2,3,4,5,repeat2 TRUTH=6; ~55 min for all)
gcode:
    {% set args = [] %}
    {% for k, v in params.items() if k not in ["BED_TEMP", "SOAK"] %}
      {% set _ = args.append(k ~ "=" ~ v) %}
    {% endfor %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    M190 S{params.BED_TEMP|default(70)|float}
    G4 P{(params.SOAK|default(10)|float * 60000)|int}
    MESH_BENCHMARK {args|join(" ")}

# --------------------------------------------------------------- calibration prints

[gcode_macro LIDAR_PA_CALIBRATION]
description: Print a pressure advance test and measure it with the LiDAR (needs a clear plate around X130-154 Y100-220)
gcode:
    {% set extruder_temp = params.EXTRUDER_TEMP|default(250)|float %}
    {% set bed_temp = params.BED_TEMP|default(70)|float %}
    {% set pa_start = params.PA_START|default(0)|float %}
    {% set pa_step = params.PA_STEP|default(0.01)|float %}
    LIDAR_PA_CALIBRATE EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp} PA_START={pa_start} PA_STEP={pa_step}

[gcode_macro LIDAR_OFFSET_CALIBRATION]
description: Print a small cross, scan it at Z3 and Z5 and save where the LiDAR looks (needs a clear plate around X135-165 Y133-167)
gcode:
    {% set extruder_temp = params.EXTRUDER_TEMP|default(250)|float %}
    {% set bed_temp = params.BED_TEMP|default(70)|float %}
    {% set x = params.X|default(150)|float %}
    {% set y = params.Y|default(150)|float %}
    {% set apply = params.APPLY|default(1)|int %}
    LIDAR_OFFSET_CALIBRATE EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp} X={x} Y={y} APPLY={apply}

[gcode_macro CREALITY_PA_TEST]
description: Print Creality's pressure advance test pattern, 20 PA values 0.020-0.096, read by eye (needs a clear plate around X170-204 Y60-199)
gcode:
    {% set extruder_temp = params.EXTRUDER_TEMP|default(250)|float %}
    {% set bed_temp = params.BED_TEMP|default(70)|float %}
    {% set x = params.X|default(170)|float %}
    {% set y = params.Y|default(60)|float %}
    {% set pa_start = params.PA_START|default(0.02)|float %}
    {% set pa_step = params.PA_STEP|default(0.004)|float %}
    LIDAR_PA_CREALITY EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp} X={x} Y={y} PA_START={pa_start} PA_STEP={pa_step}
