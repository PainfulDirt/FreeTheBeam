name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q driver klipper helper
      - name: Driver tests
        run: python -m unittest discover -s driver/tests -v
      - name: Klipper plugin tests
        run: python -m unittest discover -s klipper/tests -v
      - name: Shell syntax
        run: sh -n k1max/lidar-start.sh && sh -n helper/install.sh
