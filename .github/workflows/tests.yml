name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 24.04: setup-python still has 3.9 there (closest to the K1's 3.8)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q driver klipper helper
      - name: Driver tests
        run: python -m unittest discover -s driver/tests -v
      - name: Klipper plugin tests
        run: python -m unittest discover -s klipper/tests -v
      - name: Helper tests
        run: python -m unittest discover -s helper/tests -v
      - name: Host install test
        run: python -m unittest discover -s host/tests -v
      - name: Shell syntax
        run: sh -n k1max/lidar-start.sh && sh -n helper/install.sh && sh -n host/install.sh
